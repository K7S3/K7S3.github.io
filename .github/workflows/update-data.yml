# Refreshes ONLY the GitHub projects section of data.js, using the public
# GitHub API (no auth, no scraping). Timeline, education, and publications are
# curated by hand via linkedin.json + refresh_content.py — see README.
name: Refresh GitHub projects

on:
  schedule:
    # Weekly on Sundays; repo metadata barely changes day to day.
    - cron: '0 9 * * 0'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  update-projects:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: pip install requests

    - name: Refresh projects from GitHub API
      run: python update_data.py

    - name: Commit and push if changed
      run: |
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git config user.name "github-actions[bot]"
        git add data.js
        git diff --quiet && git diff --staged --quiet || (git commit -m "Refresh GitHub projects" && git push)
